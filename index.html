<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIURI DEFENCE PHYSICAL ACADEMY - Site Under Maintenance</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-light: #f7e599;
      --gold-dark: #9b7617;
      --gold-glow: rgba(212, 175, 55, 0.45);
      --bg-dark: #07090e;
      --bg-card: rgba(15, 20, 29, 0.75);
      --card-border: rgba(212, 175, 55, 0.25);
      --text-white: #f5f6f8;
      --text-muted: #a0a6b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 2.5rem 1rem;
    }

    /* Ambient Background Effects */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(155, 118, 23, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 45px 45px, 45px 45px;
      pointer-events: none;
      z-index: 0;
    }

    canvas#stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 860px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Animated Logo Presentation */
    .logo-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    /* Rotating Military Precision Rings */
    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orbit-ring-1 {
      inset: -14px;
      border: 1px dashed rgba(212, 175, 55, 0.35);
      animation: rotateClockwise 26s linear infinite;
    }

    .orbit-ring-2 {
      inset: -28px;
      border: 1px dotted rgba(247, 229, 153, 0.25);
      animation: rotateCounterClockwise 38s linear infinite;
    }

    .orbit-ring-3 {
      inset: -38px;
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-top-color: rgba(212, 175, 55, 0.7);
      border-bottom-color: rgba(212, 175, 55, 0.7);
      animation: rotateClockwise 18s linear infinite;
    }

    /* Dynamic Backlight Halo */
    .logo-halo {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.35) 0%, rgba(212, 175, 55, 0.1) 45%, transparent 70%);
      filter: blur(15px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Logo Image & Entrance Animation */
    .logo-img-box {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 
        0 0 35px var(--gold-glow),
        0 15px 30px rgba(0, 0, 0, 0.7);
      animation: logoEntrance 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: center center;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .logo-wrapper:hover .logo-img {
      transform: scale(1.05);
    }

    /* Metallic Shimmer Sweep Across Logo */
    .logo-img-box::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -75%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 245, 200, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      pointer-events: none;
      animation: shimmerSweep 5s ease-in-out infinite;
      animation-delay: 1.2s;
    }

    /* Academy Title */
    .academy-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #fff7cc 0%, #e5bd57 40%, #fff2b2 65%, #aa771c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.3));
      animation: fadeInDown 1.2s ease-out forwards;
    }

    /* Maintenance Badge */
    .maintenance-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 1.4rem;
      border-radius: 50px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      margin-bottom: 2.5rem;
      animation: fadeIn 1.4s ease-out forwards;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff3344;
      box-shadow: 0 0 10px #ff3344, 0 0 20px #ff3344;
      animation: pulseDot 1.8s infinite;
    }

    /* Countdown Grid */
    .countdown-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
      width: 100%;
      max-width: 680px;
      margin-bottom: 2.8rem;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    .countdown-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(212, 175, 55, 0.25);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .countdown-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .countdown-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.6);
      box-shadow: 
        0 14px 30px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(212, 175, 55, 0.2);
    }

    .countdown-number {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
    }

    .countdown-label {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0.6rem;
    }

    /* Details / Contact Card */
    .details-card {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.8rem 2rem;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.4rem;
      text-align: left;
      animation: fadeInUp 1.4s ease-out forwards;
    }

    .detail-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.95rem;
      color: var(--text-white);
    }

    .detail-icon {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 10px;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
    }

    .detail-icon svg {
      width: 20px;
      height: 20px;
      stroke: var(--gold-primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .detail-text {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      overflow: hidden;
      word-break: break-word;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold-light);
      font-weight: 600;
    }

    .detail-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a.detail-value:hover {
      color: var(--gold-primary);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Keyframe Animations */
    @keyframes logoEntrance {
      0% {
        opacity: 0;
        transform: scale(0.55) translateY(25px);
        filter: drop-shadow(0 0 0 rgba(212, 175, 55, 0));
      }
      65% {
        opacity: 1;
        transform: scale(1.04) translateY(-3px);
        filter: drop-shadow(0 0 45px rgba(212, 175, 55, 0.7));
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.45));
      }
    }

    @keyframes shimmerSweep {
      0% {
        left: -100%;
      }
      25%, 100% {
        left: 200%;
      }
    }

    @keyframes rotateClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateCounterClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes pulseGlow {
      from { opacity: 0.5; transform: scale(0.96); }
      to { opacity: 0.9; transform: scale(1.06); }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .logo-wrapper {
        width: 180px;
        height: 180px;
        margin-bottom: 1.5rem;
      }

      .orbit-ring-1 { inset: -10px; }
      .orbit-ring-2 { inset: -20px; }
      .orbit-ring-3 { inset: -28px; }

      .countdown-container {
        gap: 0.6rem;
      }

      .countdown-card {
        padding: 1rem 0.3rem;
        border-radius: 10px;
      }

      .countdown-number {
        font-size: 2rem;
      }

      .countdown-label {
        font-size: 0.72rem;
        letter-spacing: 1px;
      }

      .details-card {
        grid-template-columns: 1fr;
        padding: 1.4rem;
        gap: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Grid Background -->

  <canvas id="stars"></canvas>

  <main class="container">

  </main>

  <script>
    // 7-Day Automatic Decrementing Countdown
    (function initCountdown() {
      const STORAGE_KEY = 'sdpa_countdown_end';
      const DURATION_MS = 7 * 24 * 60 * 60 * 1000; // 7 days in milliseconds
      
      let targetTime;
      try {
        const savedTime = localStorage.getItem(STORAGE_KEY);
        if (savedTime && !isNaN(savedTime)) {
          targetTime = parseInt(savedTime, 10);
          // If the stored countdown has already elapsed, restart 7 days
          if (targetTime <= Date.now()) {
            targetTime = Date.now() + DURATION_MS;
            localStorage.setItem(STORAGE_KEY, targetTime.toString());
          }
        } else {
          targetTime = Date.now() + DURATION_MS;
          localStorage.setItem(STORAGE_KEY, targetTime.toString());
        }
      } catch (e) {
        // Fallback if localStorage is inaccessible
        targetTime = Date.now() + DURATION_MS;
      }

      const daysEl = document.getElementById('days');
      const hoursEl = document.getElementById('hours');
      const minutesEl = document.getElementById('minutes');
      const secondsEl = document.getElementById('seconds');

      function updateCountdown() {
        const now = Date.now();
        const difference = targetTime - now;

        if (difference <= 0) {
          daysEl.textContent = '00';
          hoursEl.textContent = '00';
          minutesEl.textContent = '00';
          secondsEl.textContent = '00';
          return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        daysEl.textContent = String(days).padStart(2, '0');
        hoursEl.textContent = String(hours).padStart(2, '0');
        minutesEl.textContent = String(minutes).padStart(2, '0');
        secondsEl.textContent = String(seconds).padStart(2, '0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();

    // Subtle Tactical Ambient Canvas Particles
    (function initStars() {
      const canvas = document.getElementById('stars');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      const particles = [];
      const particleCount = 45;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.6 + 0.2
        });
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'rgba(212, 175, 55, ';

        for (let i = 0; i < particleCount; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
          ctx.fill();
        }

        requestAnimationFrame(render);
      }
      render();
    })();
  </script>
